<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fixalong live view</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1c1a; --dim: #6b6862; --line: #e3e0da;
    --felix: #e8721c; --ok: #2f8a4c; --warn: #b7791f; --bad: #c0392b; --info: #3b6fb6;
    --code-bg: #f0eee9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161514; --panel: #201f1d; --text: #ecebe8; --dim: #9a968f; --line: #34322f;
      --felix: #ff9a4d; --ok: #5cc27e; --warn: #e0b04f; --bad: #ef6b5e; --info: #7aa7e8;
      --code-bg: #2a2926;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 10px 16px;
           align-items: center; padding: 12px 16px; background: var(--panel);
           border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; margin: 0 8px 0 0; }
  h1 span { color: var(--felix); }
  .pill { font-size: 13px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line);
          color: var(--dim); }
  .pill.on { color: var(--ok); border-color: var(--ok); }
  .pill.off { color: var(--bad); border-color: var(--bad); }
  select { font: inherit; font-size: 14px; padding: 4px 6px; background: var(--panel); color: var(--text);
           border: 1px solid var(--line); border-radius: 6px; max-width: 100%; }
  /* The timeline, with what's in the headset now beside it on a wide screen. */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; max-width: 1320px;
            margin: 0 auto; padding: 12px 16px 80px; align-items: start; }
  main { min-width: 0; }
  aside { position: sticky; top: 64px; display: flex; flex-direction: column; gap: 10px; }
  aside section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  aside h2 { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--dim); }
  @media (max-width: 1099px) { .layout { grid-template-columns: minmax(0, 1fr); } aside { display: none; } }
  /* Which Meta model did it. */
  .who { display: inline-block; margin-left: 8px; font-size: 11px; font-weight: 500; padding: 1px 8px;
         border-radius: 999px; background: var(--code-bg); color: var(--dim); vertical-align: 1px;
         font-style: normal; }
  .who.spark { color: var(--info); }
  .who.voice { color: var(--ok); }
  body.story .noise { display: none; }
  button.pill { font: inherit; font-size: 13px; background: var(--panel); cursor: pointer; }
  button.rec.on { color: #fff; background: var(--bad); border-color: var(--bad); }
  .row { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 10px 12px; margin: 6px 0;
         background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--line);
         border-radius: 8px; }
  .time { color: var(--dim); font: 12px/1.9 ui-monospace, Consolas, monospace; }
  .body { min-width: 0; overflow-wrap: anywhere; }
  .k-connected, .k-hello { border-left-color: var(--ok); }
  .k-disconnected { border-left-color: var(--bad); }
  .k-photo { border-left-color: var(--info); }
  .k-felix_says, .k-felix_quiet { border-left-color: var(--felix); }
  .k-parts { border-left-color: var(--info); }
  .labeled { position: relative; display: inline-block; max-width: min(100%, 360px); margin-top: 6px; }
  .labeled img { max-width: 100%; margin-top: 0; }
  .tag { position: absolute; transform: translate(-50%, calc(-100% - 6px)); white-space: nowrap;
         background: rgb(20 20 24 / 0.85); color: #fff; font-size: 11px; padding: 2px 6px;
         border-radius: 6px; pointer-events: none; }
  .tag::after { content: ""; position: absolute; left: 50%; top: calc(100% + 2px); width: 7px; height: 7px;
                margin-left: -3.5px; border-radius: 50%; background: var(--felix); border: 1px solid #fff; }
  .k-error { border-left-color: var(--bad); }
  .k-panel, .k-scribe { border-left-color: var(--felix); }
  .k-verify.passed { border-left-color: var(--ok); }
  .k-verify.not-yet, .k-tool_refused { border-left-color: var(--warn); }
  .k-felix_thinks, .k-scribe { padding: 6px 12px; }
  .checklist { list-style: none; margin: 6px 0 0; padding: 0; }
  .checklist li { padding: 2px 0; }
  .checklist .mark { display: inline-block; width: 1.4em; font-weight: 700; color: var(--felix); }
  .checklist .dim { color: var(--dim); text-decoration: line-through; }
  .checklist .active { font-weight: 600; }
  .checklist .found { color: var(--felix); font-weight: 700; }
  .k-headset_log { padding: 6px 12px; }
  .felix { font-size: 16px; }
  .felix::before { content: "Felix: "; color: var(--felix); font-weight: 600; }
  .meta, .label, .dim { color: var(--dim); font-size: 13px; }
  audio { display: block; margin-top: 6px; height: 32px; width: min(100%, 320px); }
  img { display: block; margin-top: 6px; max-width: min(100%, 360px); border-radius: 6px;
        border: 1px solid var(--line); }
  code { font: 12.5px/1.5 ui-monospace, Consolas, monospace; background: var(--code-bg);
         padding: 2px 6px; border-radius: 4px; white-space: pre-wrap; }
  code.warning { color: var(--warn); }
  code.error, code.exception, code.assert { color: var(--bad); }
  .k-heard { border-left-color: var(--text); }
  .k-heard.not-for-felix { opacity: 0.6; border-left-color: var(--line); }
  .you::before { content: "You: "; font-weight: 600; }
  #hearing { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
             max-width: min(860px, calc(100% - 32px)); padding: 8px 14px; border-radius: 999px;
             background: var(--panel); border: 1px solid var(--line); color: var(--dim);
             font-size: 14px; box-shadow: 0 2px 10px rgb(0 0 0 / 0.12); }
  #hearing:empty { display: none; }
  .divider { margin: 18px 0 6px; color: var(--dim); font-size: 13px; text-align: center; }
  .empty { color: var(--dim); text-align: center; margin-top: 60px; }
</style>
</head>
<body>
<header>
  <h1><span>fixalong</span> live view</h1>
  <span id="feed" class="pill">Live feed: connecting</span>
  <span id="headset" class="pill">Headset: unknown</span>
  <label class="dim">Session
    <select id="session"><option value="live">Live: follow the newest</option></select>
  </label>
  <label class="dim"><input type="checkbox" id="details"> Details</label>
  <button id="rec" class="pill rec" type="button" title="Record this tab to a video file">● Rec</button>
</header>
<div class="layout">
  <main id="timeline"></main>
  <aside aria-label="In the headset now">
    <section><h2>In the headset now</h2><div id="now-photo" class="dim">No labels yet</div></section>
    <section><h2>Checklist</h2><div id="now-panel" class="dim">Not up yet</div></section>
    <section><h2>Verifier, last verdict</h2><div id="now-verdict" class="dim">Nothing checked yet</div></section>
  </aside>
</div>
<div id="hearing" aria-live="polite"></div>

<script>
const timeline = document.getElementById("timeline");
const hearing = document.getElementById("hearing");
let hearingTimer = null;
const picker = document.getElementById("session");
const feedPill = document.getElementById("feed");
const headsetPill = document.getElementById("headset");
const nowPhoto = document.getElementById("now-photo");
const nowPanel = document.getElementById("now-panel");
const nowVerdict = document.getElementById("now-verdict");
let shown = null; // the session on screen

// Which Meta model each kind of row comes from, for anyone watching.
const WHO = {
  heard: ["Muse Voice Transcribe", "voice"],
  felix_says: ["Muse Spark · talker", "spark"],
  felix_quiet: ["Muse Spark · talker", "spark"],
  scribe: ["Muse Spark · scribe, with tools", "spark"],
  verify: ["Muse Spark · verifier", "spark"],
  parts: ["Muse Spark · labeler", "spark"],
  hazards: ["Muse Spark · hazard check", "spark"],
  looked_up: ["Muse Spark · look-up", "spark"],
};
// Rows that only matter when debugging: hidden unless Details is on.
const NOISE = new Set(["headset_log", "felix_thinks", "photo", "filler", "busy", "rethink",
                       "caution_seen", "photo_timeout", "hello"]);

// ?replay=<session> shows a recorded session as it looked live, on a clock the caller
// moves (see replayTo), so it can be filmed frame by frame without a screen recorder's blur.
const replaying = new URLSearchParams(location.search).get("replay");

const details = document.getElementById("details");
try { details.checked = !replaying && localStorage.getItem("details") === "on"; } catch {}
document.body.classList.toggle("story", !details.checked);
details.onchange = () => {
  document.body.classList.toggle("story", !details.checked);
  try { localStorage.setItem("details", details.checked ? "on" : "off"); } catch {}
};

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}
const fileUrl = (session, path) => `/sessions/${session}/${path}`;
const secs = msValue => (msValue / 1000).toFixed(1) + "s";

function setPill(pill, label, state) {
  pill.textContent = label;
  pill.className = "pill" + (state === true ? " on" : state === false ? " off" : "");
}

// Partial transcripts update one floating caption instead of adding rows.
function showHearing(text) {
  hearing.textContent = "Hearing: " + text;
  clearTimeout(hearingTimer);
  hearingTimer = setTimeout(() => (hearing.textContent = ""), 4000);
}

function render(session, e) {
  if (e.kind === "hearing") return showHearing(e.text);
  timeline.querySelector(".empty")?.remove();
  const nearBottom = innerHeight + scrollY >= document.body.scrollHeight - 80;
  const row = el("div", "row k-" + e.kind);
  row.append(el("span", "time", "+" + e.t.toFixed(1) + "s"));
  const body = el("div", "body");
  switch (e.kind) {
    case "connected":
      body.append(el("b", null, "Headset connected"), el("span", "dim", " from " + (e.address || "?")));
      setPill(headsetPill, "Headset: connected", true);
      break;
    case "disconnected":
      body.append(el("b", null, "Headset disconnected"));
      setPill(headsetPill, "Headset: offline", false);
      break;
    case "hello":
      body.textContent = `Hello from ${e.device || "the headset"} (app ${e.app || "?"})`;
      break;
    case "photo": {
      const link = el("a");
      link.href = fileUrl(session, e.file);
      link.target = "_blank";
      const img = el("img");
      img.src = link.href;
      img.alt = "Photo from the headset";
      link.append(img);
      const reason = e.reason === "pinch" ? " · you pinched" : "";  // pinches only in early sessions
      body.append(el("div", "label", `Photo ${e.file} · ${e.kb} KB${reason}`), link);
      break;
    }
    case "heard":
      hearing.textContent = "";
      if (!e.for_felix) row.classList.add("not-for-felix");
      body.append(el("div", "you", e.text),
                  el("div", "meta", e.for_felix ? "for Felix" : "not for Felix (no name, conversation closed)"));
      break;
    case "parts": {
      // The labels as the headset places them: a dot on each part, its name above.
      const names = e.parts.map(p => p.name).join(", ") || "no parts found";
      const what = e.named_in ? "The part Felix named" : "Labels";
      body.append(el("div", "label", `${what} in ${e.photo} · found in ${secs(e.think_ms)}: ${names}`));
      if (e.photo && e.parts.length) {
        const frame = el("div", "labeled");
        const img = el("img");
        img.src = fileUrl(session, e.photo);
        img.alt = "Photo with part labels";
        frame.append(img);
        for (const p of e.parts) {
          const tag = el("span", "tag", p.name);
          tag.style.left = p.x / 10 + "%";
          tag.style.top = p.y / 10 + "%";
          frame.append(tag);
        }
        body.append(frame);
        if (!e.named_in) {
          nowPhoto.className = "";
          nowPhoto.replaceChildren(frame.cloneNode(true));
        }
      }
      break;
    }
    case "rethink":
      body.append(el("span", "dim", "You said more before Felix answered, so he started over with all of it"));
      break;
    case "felix_quiet":
      body.append(el("div", "felix dim", "(stays quiet)"),
                  el("div", "meta", "thought " + secs(e.think_ms)));
      break;
    case "busy":
      body.append(el("span", "dim", `Ignored a ${e.ignored} while Felix was still answering`));
      break;
    case "photo_timeout":
      body.append(el("span", "dim", "The headset didn't send a photo in time; Felix answered without one"));
      break;
    case "felix_says": {
      const timing = [];
      if (e.think_ms != null) timing.push("thought " + secs(e.think_ms));
      timing.push("voice " + secs(e.voice_ms));
      if (e.focus?.length) timing.push("pointing at " + e.focus.join(", "));
      const audio = el("audio");
      audio.controls = true;
      audio.preload = "none";
      audio.src = fileUrl(session, e.audio);
      body.append(el("div", "felix", e.text), el("div", "meta", timing.join(" · ")), audio);
      break;
    }
    case "felix_thinks":
      body.append(el("span", "dim", "Felix thought " + secs(e.think_ms)));
      break;
    case "filler":
      body.append(el("span", "dim", e.checking ? "Felix: “let me look” while he checks" : "Felix: “mm-hm” while he thinks"));
      break;
    case "farewell":
      body.append(el("b", null, "Felix said goodbye and headed off; the next “Felix” starts a new job"));
      resetNow(); // the headset clears too
      break;
    case "countdown_done":
      body.append(el("span", null, `Countdown “${e.text}” over the ${e.part} ran out`));
      break;
    case "hazards":
      body.append(el("span", e.hazards.length ? null : "dim", e.hazards.length
        ? `Hazard in ${e.photo}, its sign waiting for Felix: ` + e.hazards.map(h => `“${h.line}” (${h.name})`).join(", ")
        : `No new hazards in ${e.photo} · ${secs(e.think_ms)}`));
      break;
    case "caution_shown":
      body.append(el("b", null, `Felix brings up a caution, and its sign goes up: “${e.text}”`));
      break;
    case "caution_seen":
      body.append(el("span", "dim", `You looked at caution sign ${e.id}`));
      break;
    case "caution_acknowledged":
      body.append(el("span", e.line ? null : "dim", e.line
        ? `You acknowledged “${e.line}” (${e.how})` : `Caution sign ${e.id} was already closed`));
      break;
    case "tapped":
      body.append(el("span", e.checked ? null : "dim", e.checked
        ? `You checked off “${e.checked}” on the checklist`
        : `You pinched a row (${e.id}) that can't be checked off now`));
      break;
    case "scribe": {
      // The job's record, kept in the background while Felix talks.
      const tools = e.tools.map(t => `${t.name}(${JSON.stringify(t.args)})`).join("\n");
      body.append(el("div", "label", `Record updated in ${secs(e.think_ms)}`),
                  el("code", null, tools || "no changes"));
      break;
    }
    case "panel": {
      // The checklist as the headset shows it.
      const marks = { check: "✓", question: "?", bang: "!", dot: "▸", none: "" };
      const list = el("ul", "checklist");
      for (const row of e.rows) {
        const item = el("li", row.style);
        item.prepend(el("span", "mark", marks[row.mark] ?? ""));
        item.append(row.text);
        list.append(item);
      }
      body.append(el("b", null, e.title || "(panel hidden)"), list);
      nowPanel.className = "";
      nowPanel.replaceChildren(el("b", null, e.title || "(hidden)"), list.cloneNode(true));
      break;
    }
    case "verify":
      row.classList.add(e.passed ? "passed" : "not-yet");
      body.append(el("b", null, `Verifier on ${e.check}: ${e.passed ? (e.checked_off ? "checked off by them" : e.on_word ? "passed on their word" : "passed") : "not yet"}`),
                  el("div", "meta", "Seen: " + e.seen));
      if (!e.passed && e.correction) body.append(el("div", "meta", "Correction: " + e.correction));
      nowVerdict.className = "";
      nowVerdict.replaceChildren(...[...body.childNodes].map(n => n.cloneNode(true)));
      break;
    case "tool_refused":
      body.append(el("b", null, `The server refused ${e.tool}: `), el("span", null, e.error));
      break;
    case "looked_up":
      body.append(el("b", null, "Looked up: "), el("span", null, e.question),
                  el("div", "meta", `${e.answer} (${secs(e.think_ms)})`));
      break;
    case "headset_log":
      body.append(el("code", (e.level || "").toLowerCase(), e.text));
      break;
    case "error":
      body.append(el("b", null, `Error while handling "${e.during}": `), el("code", "error", e.error));
      break;
    default:
      body.append(el("code", null, JSON.stringify(e)));
  }
  if (WHO[e.kind]) {
    const [name, family] = WHO[e.kind];
    (body.firstChild || body).append(el("span", "who " + family, name));
  }
  if (NOISE.has(e.kind) || (e.kind === "hazards" && !e.hazards.length)
      || (e.kind === "scribe" && !e.tools.length)) row.classList.add("noise");
  row.append(body);
  timeline.append(row);
  if (nearBottom && !replaying) row.scrollIntoView({ block: "end" });
}

// Replay: the session's events, and how far the clock has got.
let replayEvents = [], replayNext = 0, replayClock = 0, replayScroll = 0;

// Shows the session as it stood t seconds in, scrolled toward its newest row the way a
// person watching would follow it. Waits for new photos to load. Returns whether the
// frame changed, and whether the session is over.
window.replayTo = async t => {
  const before = replayNext;
  while (replayNext < replayEvents.length && replayEvents[replayNext].t <= t) {
    render(shown, replayEvents[replayNext++]);
  }
  const images = [...document.querySelectorAll("img:not([data-ready])")];
  await Promise.all(images.map(img => img.decode().catch(() => {}).then(() => (img.dataset.ready = "1"))));
  const bottom = Math.max(0, document.documentElement.scrollHeight - innerHeight);
  const step = (bottom - replayScroll) * Math.min(1, (t - replayClock) * 5);
  replayClock = t;
  const moved = Math.abs(step) >= 0.5;
  replayScroll = moved ? replayScroll + step : bottom;
  scrollTo(0, Math.round(replayScroll));
  return { changed: replayNext > before || moved, done: replayNext >= replayEvents.length };
};

async function startReplay(sessionId) {
  document.getElementById("rec").hidden = true;
  setPill(feedPill, "Live feed: on", true);
  shown = sessionId;
  timeline.replaceChildren();
  resetNow();
  replayEvents = await (await fetch(`/api/sessions/${sessionId}/events`)).json();
  window.replayReady = true;
}

async function loadSessions() {
  const sessions = await (await fetch("/api/sessions")).json();
  const current = picker.value;
  picker.length = 1;
  for (const s of sessions) picker.append(new Option(`${s.id} (${s.events} events)`, s.id));
  picker.value = current;
  return sessions;
}

function resetNow() {
  nowPhoto.className = nowPanel.className = nowVerdict.className = "dim";
  nowPhoto.textContent = "No labels yet";
  nowPanel.textContent = "Not up yet";
  nowVerdict.textContent = "Nothing checked yet";
}

async function show(sessionId) {
  timeline.replaceChildren();
  resetNow();
  shown = sessionId;
  if (!sessionId) {
    timeline.append(el("p", "empty", "No sessions yet. Open fixalong on the headset."));
    return;
  }
  const events = await (await fetch(`/api/sessions/${sessionId}/events`)).json();
  for (const e of events) render(sessionId, e);
}

function connectFeed() {
  const feed = new WebSocket(`ws://${location.host}/monitor`);
  feed.onopen = () => setPill(feedPill, "Live feed: on", true);
  feed.onclose = () => {
    setPill(feedPill, "Live feed: reconnecting", false);
    setTimeout(connectFeed, 2000);
  };
  feed.onmessage = message => {
    const { session, event } = JSON.parse(message.data);
    if (event.kind === "connected") loadSessions();
    if (picker.value !== "live") return;
    if (session !== shown) {
      if (shown) timeline.append(el("div", "divider", `New session ${session}`));
      else timeline.replaceChildren();
      resetNow();
      shown = session;
    }
    render(session, event);
  };
}

// Rec: records this tab to a video in Downloads, named for when it started, so it lines
// up with the session log. Stop here, or with the browser's "Stop sharing". MP4 (H.264)
// when the browser can: Chrome's WebM has no duration, and Windows wouldn't play it.
// High profile, level 5.1, since a tab can be bigger than 1080p; a high bitrate keeps
// text sharp.
const REC_TYPES = ["video/mp4;codecs=avc1.640033", "video/mp4;codecs=avc1.640028", "video/mp4",
                   "video/webm;codecs=vp9", "video/webm"];
const REC_BITRATE = 12_000_000;
const recButton = document.getElementById("rec");
let recorder = null;
const pad = n => String(n).padStart(2, "0");
const stamp = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-` +
                   `${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
recButton.onclick = async () => {
  if (recorder) {
    if (recorder.state === "recording") recorder.stop();
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: 30 }, audio: false, preferCurrentTab: true, selfBrowserSurface: "include" });
  } catch {
    return; // the picker was cancelled
  }
  const type = REC_TYPES.find(t => MediaRecorder.isTypeSupported(t)) || "";
  const container = type.startsWith("video/mp4") ? "mp4" : "webm";
  const chunks = [];
  const started = new Date();
  recorder = new MediaRecorder(stream, { ...(type && { mimeType: type }), videoBitsPerSecond: REC_BITRATE });
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  const tick = setInterval(() => {
    const s = Math.round((Date.now() - started) / 1000);
    recButton.textContent = `■ Stop ${Math.floor(s / 60)}:${pad(s % 60)}`;
  }, 1000);
  recorder.onstop = () => {
    clearInterval(tick);
    stream.getTracks().forEach(t => t.stop());
    recorder = null;
    recButton.textContent = "● Rec";
    recButton.classList.remove("on");
    const link = el("a");
    link.href = URL.createObjectURL(new Blob(chunks, { type: `video/${container}` }));
    link.download = `fixalong-live-${stamp(started)}.${container}`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 60000);
  };
  stream.getVideoTracks()[0].addEventListener("ended", () => {
    if (recorder?.state === "recording") recorder.stop();
  });
  recorder.start(1000);
  recButton.classList.add("on");
  recButton.textContent = "■ Stop 0:00";
};

picker.onchange = async () => {
  if (picker.value === "live") {
    const sessions = await loadSessions();
    await show(sessions[0]?.id);
  } else {
    await show(picker.value);
  }
};

(async () => {
  const sessions = await loadSessions();
  if (replaying) return startReplay(replaying);
  await show(sessions[0]?.id);
  connectFeed();
})();
</script>
</body>
